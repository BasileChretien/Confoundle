name: Automerge Dependabot

# "Auto-update after careful check" means the check has to be the thing that
# decides, not a human glancing at a version number. This workflow enables
# GitHub's auto-merge on a Dependabot pull request, which holds the merge until
# every required status check passes and drops it the moment one fails.
#
# So the honest description is: patch and minor updates land unattended IF CI
# proves the project still type-checks, its 300-odd tests still pass, and a real
# production build still succeeds. Anything else waits for a person.
#
# For this to work the repository must have:
#   Settings, General, Pull Requests, "Allow auto-merge" enabled
#   Settings, Rules or Branches, a rule on main requiring the CI check
# Without the required check, auto-merge would merge immediately and the gate
# would be decorative. See docs/dependencies.md.

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Read what this PR actually updates
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Majors are excluded deliberately. Every major in this session's upgrade
      # needed either a coordinated bump or a source change, and neither is
      # something a test suite can be trusted to notice on its own: a UI
      # framework can change how something looks without failing an assertion.
      - name: Enable auto-merge for patch and minor only
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Flag a major for review
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr comment "$PR_URL" --body \
            "Major version update, so this will not automerge. CI still runs; read it before merging, and check the upstream migration guide for source changes the tests cannot see."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
