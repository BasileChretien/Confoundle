# Postinstall scripts do not run unless a package is listed here. That is
# pnpm's default and it is worth keeping: an install is otherwise arbitrary
# code execution from every package in the tree. esbuild genuinely needs its
# script to fetch a platform binary; nothing else here does.
allowBuilds:
  esbuild: true

# Refuse any version published less than three days ago.
#
# This is the protection that actually fits this project's situation. The
# repository is private on a free plan, so GitHub's required status checks and
# auto-merge are unavailable, which means no automated gate can hold a merge
# back. What CAN be held back is the install itself.
#
# The attack it addresses is a maintainer account compromise, where a malicious
# version is published and then usually caught and pulled within hours. Waiting
# three days means an automated weekly update never reaches for a version the
# ecosystem has not had time to look at. The cost is that genuinely urgent
# security patches also wait, which is the right trade for an unattended
# process: an urgent patch gets applied by hand, deliberately, and nothing here
# prevents that.
minimumReleaseAge: 4320

# Force patched versions of transitive dependencies into the tree. Each one
# arrives only through the build tooling, never into the shipped bundle, so
# none of these advisories can reach a reader. They are pinned anyway because a
# high advisory left open is one nobody looks at twice, and because each fix is
# a patch release with no API surface.
#
# An override is the only lever that works here. None of these are declared in
# package.json, and their parents' ranges already permit the patched version,
# so pnpm has no reason to re-resolve them: `pnpm update <pkg> --depth Infinity`
# reports "Already up to date" and leaves the locked version alone.
overrides:
  # vite-plugin-pwa > workbox-build. DoS, GHSA-mh99-v99m-4gvg.
  brace-expansion: ">=5.0.8"

  # vite-plugin-pwa > workbox-build > ajv. Host confusion via a backslash
  # authority introducer, GHSA-7p8r-x3mc-p8w7. Capped below 4 because ajv
  # declares ^3.0.1: upstream backported the fix to the 3.x line and publishes
  # it under the "three" dist-tag, while "latest" points at a 4.x that ajv has
  # not adopted. An uncapped floor would quietly force that major on it.
  fast-uri: ">=3.1.5 <4"
